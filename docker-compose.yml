version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: coffee_procurement_db
    restart: always
    environment:
      POSTGRES_USER: coffee_admin
      POSTGRES_PASSWORD: coffee_secret_password
      POSTGRES_DB: coffee_inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database_seed.sql:/docker-entrypoint-initdb.d/init.sql:ro

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: coffee_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@coffee.vn
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coffee_backend_api
    restart: always
    environment:
      DATABASE_URL: postgresql://coffee_admin:coffee_secret_password@db:5432/coffee_inventory
      PROJECT_NAME: "Coffee AI Procurement Agent"
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: coffee_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
