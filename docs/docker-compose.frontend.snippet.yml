# Dán service này vào docker-compose.yml ở thư mục gốc DCCN/ (cùng cấp với postgres, backend)
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: dccn_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
